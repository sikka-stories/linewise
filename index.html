    <script>
      // Blocking and inline on purpose: this has to run before the first
      // paint, or a dark-mode visitor sees a flash of the light theme while
      // React boots.
      (function () {
        var stored = localStorage.getItem('mathspace.theme');
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
        try {
          var st = JSON.parse(localStorage.getItem('mathspace.settings.v1') || '{}');
          document.documentElement.dataset.contrast = st.contrast || 'normal';
          document.documentElement.dataset.cb = st.colorblind ? 'on' : 'off';
          document.documentElement.dataset.font = st.font || 'default';
          document.documentElement.dataset.accent = st.accent || 'default';
          document.documentElement.style.fontSize = (110 * (st.textScale || 100) * (st.projector ? 1.4 : 1)) / 100 + '%';
        } catch (e) {}
      })();
    </script>
