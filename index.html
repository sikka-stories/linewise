    <script>
      // Blocking and inline on purpose: this has to run before the first
      // paint, or a dark-mode visitor sees a flash of the light theme while
      // React boots.
      (function () {
        var stored = localStorage.getItem('mathspace.theme');
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
        try {
          var st = JSON.parse(localStorage.getItem('mathspace.settings.v1') || '{}');
          document.documentElement.dataset.contrast = st.contrast || 'normal';
          document.documentElement.dataset.cb = st.colorblind ? 'on' : 'off';
          document.documentElement.dataset.font = st.font || 'default';
          document.documentElement.dataset.accent = st.accent || 'default';
          document.documentElement.style.fontSize = (110 * (st.textScale || 100) * (st.projector ? 1.4 : 1)) / 100 + '%';
        } catch (e) {}
      })();
    </script>

  <body>
    <div id="root"></div>
    <!-- Never a blank page: if the app cannot start, say why. Plain script, so it runs even where the app's own code cannot. -->
    <div id="boot-help" hidden style="max-width:34rem;margin:15vh auto;padding:0 1.25rem;font:17px/1.6 Georgia,serif;color:#16191B">
      <h1 style="font-size:1.6rem;margin:0 0 .75rem">Linewise could not start</h1>
      <p id="boot-why" style="margin:0 0 .75rem"></p>
    </div>
    <script>
      (function () {
        var show = function (why) {
          if (document.getElementById('root').childElementCount) return;
          document.getElementById('boot-why').textContent = why;
          document.getElementById('boot-help').hidden = false;
        };
        if (location.protocol === 'file:') {
          show('This file was opened straight from your computer, and browsers do not let an app like this run that way. Open it from its web address instead, such as your GitHub Pages link.');
          return;
        }
        setTimeout(function () {
          show('Part of the app did not load. Check your connection and reload the page. If you put this site up yourself, make sure every file was uploaded, including the whole assets folder.');
        }, 12000);
      })();
    </script>
